<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رولت اروپایی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c;
    --btn: #25272b;
    --btn-gray: #3d3d3d;
    --lime: #c4f24b;
    --red: #e53935;
    --green-btn: #8fc41e;
    --muted: #8a8f98;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    text-rendering: geometricPrecision;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; color: #fff; }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px 4px;
    flex-shrink: 0;
  }
  .pill {
    background: #1e1e1e;
    border-radius: 20px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
  }
  .back-btn { padding: 0 14px; }
  .menu-btn { width: 70px; }
  .menu-btn .dot { width: 4px; height: 4px; background: #fff; border-radius: 50%; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 16px 8px;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }
  .user-box { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .username { font-size: 12px; color: #d0d0d0; }
  .balance {
    background: #1d2312;
    border-radius: 14px;
    height: 32px;
    min-width: 72px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 13px;
  }
  .title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

  /* Strip (horizontal roulette) */
  .wheel-area {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 6px 0 4px;
  }
  .strip-wrap {
    position: relative;
    width: 100%;
    height: 64px;
    overflow: hidden;
    background: #0c0c0c;
    border-top: 1px solid #1f1f1f;
    border-bottom: 1px solid #1f1f1f;
  }
  .strip-pointer {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    margin-left: -1px;
    background: #f5c518;
    z-index: 2;
  }
  .strip-track {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    display: flex;
    direction: ltr;
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 1);
    will-change: transform;
  }
  .strip-cell {
    flex: 0 0 54px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .strip-cell span {
    width: 48px;
    height: 44px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    font-family: Arial, sans-serif;
  }
  .strip-cell.red span { background: var(--red); }
  .strip-cell.black span { background: #2a2d33; }
  .strip-cell.green span { background: #1f9d3a; }

  .result {
    min-height: 20px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
  }
  .result.win { color: var(--lime); }
  .result.lose { color: #ff6b6b; }

  /* Betting table */
  .table-wrap {
    flex-shrink: 0;
    padding: 0 8px;
  }
  .table-grid {
    display: grid;
    grid-template-columns: 46px repeat(12, 1fr) 40px;
    grid-template-rows: repeat(3, 26px);
    gap: 3px;
    direction: ltr;
  }
  .t-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    font-family: Arial, sans-serif;
    color: #fff;
    border-radius: 3px;
    background: #2a2d33;
  }
  .t-cell.red { background: var(--red); }
  .t-cell.black { background: #2a2d33; }
  .t-zero {
    grid-column: 1;
    grid-row: 1 / 4;
    background: #1f9d3a;
    border-radius: 4px;
    font-size: 14px;
  }
  .t-col {
    background: #2a2d33;
    font-size: 11px;
    color: #cfd3d8;
  }
  .t-dozen-row {
    grid-column: 2 / 14;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin-top: 3px;
  }
  .t-dozen {
    height: 22px;
    border-radius: 4px;
    background: #22242a;
    color: #cfd3d8;
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }
  .t-outside-row {
    grid-column: 2 / 14;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3px;
    margin-top: 3px;
  }
  .t-outside {
    height: 22px;
    border-radius: 4px;
    background: #22242a;
    color: #cfd3d8;
    font-size: 10px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }
  .t-outside.red { background: var(--red); color: #fff; }
  .t-outside.black { background: #111; color: #fff; }

  /* Bets */
  .bet-section { padding: 0 12px; flex-shrink: 0; margin-top: 8px; }
  .bet-label {
    text-align: right;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 6px;
    padding-right: 4px;
  }
  .bet-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .bet-btn {
    height: 36px;
    border-radius: 8px;
    background: var(--btn);
    font-size: 12px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 3px;
    border: 2px solid transparent;
  }
  .bet-btn.zero { background: var(--green-btn); }
  .bet-btn.black { background: var(--btn-gray); }
  .bet-btn.red { background: var(--red); }
  .bet-btn.selected { border-color: var(--lime); }

  /* Controls */
  .controls {
    background: #151515;
    border-radius: 18px 18px 0 0;
    padding: 10px 12px 10px;
    margin-top: 8px;
    flex-shrink: 0;
  }
  .chips {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    margin-bottom: 6px;
  }
  .chip {
    height: 28px;
    border-radius: 8px;
    background: #22242a;
    color: #9aa0a8;
    font-size: 11px;
  }
  .amount-input {
    width: 100%;
    height: 36px;
    border-radius: 10px;
    background: #22242a;
    border: none;
    color: #fff;
    text-align: center;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 6px;
    outline: none;
  }
  .spin-btn {
    width: 100%;
    height: 42px;
    border-radius: 12px;
    background: var(--lime);
    color: #000;
    font-size: 15px;
    font-weight: 700;
  }
  .spin-btn:disabled { opacity: 0.6; }
</style>
</head>
<body>

  <div class="topbar">
    <button class="pill back-btn" type="button">
      <span>Back</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
    </button>
    <button class="pill menu-btn" type="button">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </button>
  </div>

  <div class="header">
    <div class="title">رولت اروپایی <span>🎰</span></div>
    <div class="user-box">
      <div class="username">👤 zedxer</div>
      <div class="balance">💎 <span id="balanceText">۰</span></div>
    </div>
  </div>

  <div class="wheel-area">
    <div class="strip-wrap" id="stripWrap">
      <div class="strip-pointer"></div>
      <div class="strip-track" id="track"></div>
    </div>
    <div class="result" id="result"></div>
  </div>

  <div class="table-wrap">
    <div class="table-grid" id="tableGrid"></div>
    <div class="t-dozen-row">
      <div class="t-dozen">1ST 12</div>
      <div class="t-dozen">2ND 12</div>
      <div class="t-dozen">3RD 12</div>
    </div>
    <div class="t-outside-row">
      <div class="t-outside">1-18</div>
      <div class="t-outside">EVEN</div>
      <div class="t-outside red">RED</div>
      <div class="t-outside black">BLACK</div>
      <div class="t-outside">ODD</div>
      <div class="t-outside">19-36</div>
    </div>
  </div>

  <div class="bet-section">
    <div class="bet-label">نوع شرط را انتخاب کنید:</div>
    <div class="bet-grid">
      <button class="bet-btn zero" data-bet="zero">🟢 صفر ×۱۴</button>
      <button class="bet-btn black" data-bet="black">⚫ مشکی ×۲</button>
      <button class="bet-btn red selected" data-bet="red">🔴 قرمز ×۲</button>
      <button class="bet-btn" data-bet="number">عدد ×۳۶</button>
      <button class="bet-btn" data-bet="odd">فرد ×۲</button>
      <button class="bet-btn" data-bet="even">زوج ×۲</button>
      <button class="bet-btn" data-bet="dozen1">دوجین ۱ ×۳</button>
      <button class="bet-btn" data-bet="19-36">۱۹-۳۶ ×۲</button>
      <button class="bet-btn" data-bet="1-18">۱-۱۸ ×۲</button>
    </div>
  </div>

  <div class="controls">
    <div class="chips">
      <button class="chip" data-amount="100">۱۰۰</button>
      <button class="chip" data-amount="500">۵۰۰</button>
      <button class="chip" data-amount="1000">۱ک</button>
      <button class="chip" data-amount="5000">۵ک</button>
      <button class="chip" data-amount="10000">۱۰ک</button>
    </div>
    <input class="amount-input" id="amount" type="text" inputmode="numeric" value="10">
    <button class="spin-btn" id="spinBtn">🎰 چرخش</button>
  </div>

<script>
  const NUMBERS = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
  const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const COUNT = NUMBERS.length;
  const CELL_W = 54;
  const COPIES = 16;
  const START_BALANCE = 1000;

  const stripWrap = document.getElementById("stripWrap");
  const track = document.getElementById("track");
  const resultEl = document.getElementById("result");
  const amountInput = document.getElementById("amount");
  const balanceText = document.getElementById("balanceText");
  const spinBtn = document.getElementById("spinBtn");
  const tableGrid = document.getElementById("tableGrid");

  let balance = START_BALANCE;
  let selectedBet = "red";
  let chosenNumber = null;
  let spinning = false;
  let idx = COUNT * 2;

  const fmt = (n) => Number(n).toLocaleString("fa-IR");

  function updateBalance() {
    balanceText.textContent = fmt(balance);
  }

  // Betting table (0 on the left, 3 rows x 12 columns, 2:1 on the right)
  const zeroCell = document.createElement("div");
  zeroCell.className = "t-cell t-zero";
  zeroCell.textContent = "0";
  tableGrid.appendChild(zeroCell);

  for (let c = 0; c < 12; c++) {
    [3 * c + 3, 3 * c + 2, 3 * c + 1].forEach((n, r) => {
      const cell = document.createElement("div");
      cell.className = "t-cell " + (RED.has(n) ? "red" : "black");
      cell.style.gridColumn = c + 2;
      cell.style.gridRow = r + 1;
      cell.textContent = n;
      tableGrid.appendChild(cell);
    });
  }

  for (let r = 1; r <= 3; r++) {
    const cell = document.createElement("div");
    cell.className = "t-cell t-col";
    cell.style.gridColumn = 14;
    cell.style.gridRow = r;
    cell.textContent = "2:1";
    tableGrid.appendChild(cell);
  }

  // Build the horizontal strip
  for (let c = 0; c < COPIES; c++) {
    NUMBERS.forEach(n => {
      const cell = document.createElement("div");
      const color = n === 0 ? "green" : (RED.has(n) ? "red" : "black");
      cell.className = "strip-cell " + color;
      const inner = document.createElement("span");
      inner.textContent = n;
      cell.appendChild(inner);
      track.appendChild(cell);
    });
  }

  function placeTrack(k, animate) {
    const center = stripWrap.clientWidth / 2;
    const x = center - (k * CELL_W + CELL_W / 2);
    track.style.transition = animate ? "" : "none";
    track.style.transform = `translateX(${x}px)`;
    if (!animate) void track.offsetWidth;
  }

  placeTrack(idx, false);
  window.addEventListener("resize", () => {
    if (!spinning) placeTrack(idx, false);
  });

  // Bet selection
  document.querySelectorAll(".bet-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.bet === "number") {
        const v = prompt("عدد مورد نظر را بین ۰ تا ۳۶ وارد کنید:");
        const num = parseInt(v, 10);
        if (isNaN(num) || num < 0 || num > 36) return;
        chosenNumber = num;
      }
      document.querySelectorAll(".bet-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedBet = btn.dataset.bet;
    });
  });

  // Chips set amount
  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      amountInput.value = chip.dataset.amount;
    });
  });

  function isWin(bet, n) {
    switch (bet) {
      case "zero": return n === 0;
      case "red": return RED.has(n);
      case "black": return n !== 0 && !RED.has(n);
      case "number": return n === chosenNumber;
      case "odd": return n !== 0 && n % 2 === 1;
      case "even": return n !== 0 && n % 2 === 0;
      case "dozen1": return n >= 1 && n <= 12;
      case "19-36": return n >= 19 && n <= 36;
      case "1-18": return n >= 1 && n <= 18;
      default: return false;
    }
  }

  function multiplier(bet) {
    return { zero: 14, number: 36, dozen1: 3 }[bet] || 2;
  }

  const BET_NAMES = {
    zero: "صفر", black: "مشکی", red: "قرمز", number: "عدد", odd: "فرد", even: "زوج",
    dozen1: "دوجین ۱", "19-36": "۱۹-۳۶", "1-18": "۱-۱۸"
  };

  function showResult(text, cls) {
    resultEl.textContent = text;
    resultEl.className = "result " + (cls || "");
  }

  // Spin
  spinBtn.addEventListener("click", () => {
    if (spinning) return;

    if (selectedBet === "number" && chosenNumber === null) {
      showResult("ابتدا یک عدد انتخاب کنید", "lose");
      return;
    }

    const amount = parseInt(amountInput.value.replace(/[^\d]/g, ""), 10) || 0;
    if (amount <= 0) {
      showResult("مبلغ شرط معتبر نیست", "lose");
      return;
    }
    if (amount > balance) {
      showResult("موجودی کافی نیست", "lose");
      return;
    }

    balance -= amount;
    updateBalance();

    spinning = true;
    spinBtn.disabled = true;
    showResult("در حال چرخش...");

    const winIndex = Math.floor(Math.random() * COUNT);
    const winNumber = NUMBERS[winIndex];
    const laps = 5 + Math.floor(Math.random() * 3);
    const delta = ((winIndex - (idx % COUNT)) % COUNT + COUNT) % COUNT;
    const target = idx + laps * COUNT + delta;

    placeTrack(target, true);
    idx = target;

    setTimeout(() => {
      idx = COUNT * 2 + (idx % COUNT);
      placeTrack(idx, false);

      const label = BET_NAMES[selectedBet];
      if (isWin(selectedBet, winNumber)) {
        const payout = amount * multiplier(selectedBet);
        balance += payout;
        updateBalance();
        showResult(`عدد ${fmt(winNumber)} — بردید! (${label}) مبلغ برد: ${fmt(payout)}`, "win");
      } else {
        showResult(`عدد ${fmt(winNumber)} — باختید (${label}) مبلغ باخت: ${fmt(amount)}`, "lose");
      }
      spinning = false;
      spinBtn.disabled = false;
    }, 4100);
  });

  updateBalance();
</script>
</body>
</html>
