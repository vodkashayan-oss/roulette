<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Roulette Game</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f1015; color: #fff; display: flex; justify-content: center; min-height: 100vh; padding: 10px; }
    .app { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 12px; }
    
    /* Header & History */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .title { font-size: 18px; font-weight: bold; color: #fff; }
    .history-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
    .history-bar::-webkit-scrollbar { display: none; }
    .hist-item { min-width: 35px; height: 45px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: #fff; }
    .hist-red { background: #d32f2f; }
    .hist-black { background: #24252d; }
    .hist-green { background: #388e3c; }

    /* Canvas Wheel Container */
    .wheel-container { display: flex; justify-content: center; margin: 10px 0; }
    canvas { width: 220px; height: 220px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
    
    /* Betting Table */
    .table-container { background: #1a1b23; padding: 10px; border-radius: 12px; }
    .grid { display: grid; grid-template-columns: 40px repeat(12, 1fr) 40px; gap: 4px; }
    .cell { height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; user-select: none; transition: 0.2s; }
    .cell:active { transform: scale(0.95); }
    .cell.red { background: #d32f2f; color: #fff; }
    .cell.black { background: #24252d; color: #fff; }
    .cell.green { background: #388e3c; color: #fff; }
    .cell.empty { background: #24252d; cursor: default; }
    .cell.num { grid-column: span 1; }
    .cell.zero { grid-row: span 3; height: auto; }
    .cell.span-3 { grid-row: span 3; height: auto; background: #24252d; font-size: 12px; color: #888; }
    
    .bottom-bets { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 4px; }
    .bottom-bets .cell { height: 35px; font-size: 11px; background: #24252d; color: #ccc; }
    .bottom-bets .cell.red-bet { background: #d32f2f; }
    .bottom-bets .cell.black-bet { background: #1a1b23; border: 1px solid #333; }

    /* Controls */
    .controls { background: #1a1b23; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    .spin-btn { width: 100%; padding: 15px; border-radius: 8px; border: none; background: #388e3c; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .spin-btn:disabled { background: #2a2b33; color: #666; cursor: not-allowed; }
    .balance-box { display: flex; justify-content: space-between; background: #0f1015; padding: 12px; border-radius: 8px; border: 1px solid #2a2b33; align-items: center; }
    .balance-text { color: #aaa; font-size: 14px; }
    .balance-val { font-weight: bold; color: #fff; font-size: 16px; }
    .win-alert { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #388e3c; color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 100; }
    .win-alert.show { opacity: 1; transform: translate(-50%, 10px); }
</style>
</head>
<body>

<div class="win-alert" id="winAlert">شما برنده شدید!</div>

<div class="app">
    <div class="header">
        <div class="title">🎰 رولت</div>
    </div>

    <!-- تاریخچه اعداد -->
    <div class="history-bar" id="historyBar">
        <div class="hist-item hist-black">?</div>
    </div>

    <!-- چرخ انیمیشن -->
    <div class="wheel-container">
        <canvas id="wheelCanvas" width="220" height="220"></canvas>
    </div>

    <!-- میز شرط بندی -->
    <div class="table-container">
        <div class="grid" id="bettingGrid">
            <!-- ساخته شده با جاوا اسکریپت -->
        </div>
        <div class="bottom-bets" id="bottomBets">
            <div class="cell">1ST 12</div>
            <div class="cell">2ND 12</div>
            <div class="cell">3RD 12</div>
            <div class="cell">1-18</div>
            <div class="cell">EVEN</div>
            <div class="cell red-bet">RED</div>
            <div class="cell black-bet">BLACK</div>
            <div class="cell">ODD</div>
            <div class="cell">19-36</div>
        </div>
    </div>

    <!-- کنترل ها -->
    <div class="controls">
        <div class="balance-box">
            <span class="balance-text">موجودی:</span>
            <span class="balance-val" id="balanceDisplay">1000 $</span>
        </div>
        <button class="spin-btn" id="spinBtn">چرخاندن (SPIN)</button>
    </div>
</div>

<script>
const NUMBERS = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
let balance = 1000;

// ساخت جدول اعداد
const grid = document.getElementById('bettingGrid');
// عدد صفر
const zeroCell = document.createElement('div');
zeroCell.className = 'cell green zero num';
zeroCell.textContent = '0';
grid.appendChild(zeroCell);

// اعداد 1 تا 36 (چیدمان 3 ردیفه مثل عکس)
for (let row = 0; row < 3; row++) {
    for (let col = 1; col <= 12; col++) {
        let num;
        if (row === 0) num = col * 3;
        else if (row === 1) num = col * 3 - 1;
        else num = col * 3 - 2;
        
        const cell = document.createElement('div');
        cell.className = `cell num ${RED.has(num) ? 'red' : 'black'}`;
        cell.textContent = num;
        cell.dataset.num = num;
        grid.appendChild(cell);
    }
}
// دکمه های 2:1
for(let i=0; i<3; i++){
    const cell = document.createElement('div');
    cell.className = 'cell span-3';
    cell.textContent = '2:1';
    grid.appendChild(cell);
}

// --- انیمیشن چرخ ---
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const CX = 110, CY = 110, R = 100;

function drawWheel(angle) {
    ctx.clearRect(0, 0, 220, 220);
    
    // چرخ
    for (let i = 0; i < 37; i++) {
        const startAngle = i * (Math.PI * 2 / 37) + angle;
        const endAngle = (i + 1) * (Math.PI * 2 / 37) + angle;
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.arc(CX, CY, R, startAngle, endAngle);
        ctx.closePath();
        
        const num = NUMBERS[i];
        ctx.fillStyle = num === 0 ? '#388e3c' : (RED.has(num) ? '#d32f2f' : '#1a1b23');
        ctx.fill();
        ctx.strokeStyle = '#0f1015';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        // نوشتن عدد
        ctx.save();
        ctx.translate(CX, CY);
        ctx.rotate(startAngle + (endAngle - startAngle) / 2);
        ctx.translate(R - 15, 0);
        ctx.rotate(Math.PI / 2);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(num, 0, 0);
        ctx.restore();
    }
    
    // مرکز
    ctx.beginPath();
    ctx.arc(CX, CY, 30, 0, Math.PI * 2);
    ctx.fillStyle = '#1a1b23';
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // نشانگر بالا
    ctx.beginPath();
    ctx.moveTo(CX, CY - R - 5);
    ctx.lineTo(CX - 6, CY - R - 15);
    ctx.lineTo(CX + 6, CY - R - 15);
    ctx.closePath();
    ctx.fillStyle = '#fff';
    ctx.fill();
}

let currentAngle = 0;
drawWheel(currentAngle);

// --- منطق بازی ---
const spinBtn = document.getElementById('spinBtn');
const historyBar = document.getElementById('historyBar');
const balanceDisplay = document.getElementById('balanceDisplay');
const winAlert = document.getElementById('winAlert');

let isSpinning = false;

spinBtn.addEventListener('click', () => {
    if (isSpinning) return;
    if (balance < 10) { alert('موجودی کافی نیست!'); return; }
    
    isSpinning = true;
    spinBtn.disabled = true;
    balance -= 10; // شرط ثابت 10 دلاری
    balanceDisplay.textContent = balance + ' $';
    
    const targetIndex = Math.floor(Math.random() * 37);
    const targetNum = NUMBERS[targetIndex];
    
    const targetAngle = -(targetIndex * (Math.PI * 2 / 37)) + (Math.PI * 2 * 10); // 10 دور کامل
    const duration = 4000; // 4 ثانیه
    const startTime = performance.now();
    const startAngle = currentAngle;

    function animate(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // افکت کندی (easeOutCubic)
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
        
        drawWheel(currentAngle);
        
        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            finishGame(targetNum);
        }
    }
    
    requestAnimationFrame(animate);
});

function finishGame(num) {
    isSpinning = false;
    spinBtn.disabled = false;
    
    // آپدیت تاریخچه
    const histItem = document.createElement('div');
    histItem.className = `hist-item ${num === 0 ? 'hist-green' : (RED.has(num) ? 'hist-red' : 'hist-black')}`;
    histItem.textContent = num;
    historyBar.prepend(histItem);
    if (historyBar.children.length > 10) {
        historyBar.lastChild.remove();
    }
    
    // بررسی برد (چون فعلاً کاربر جایی کلیک نمی‌کنه، رندوم جایزه میدیم)
    if (num !== 0 && Math.random() > 0.5) {
        const winAmount = 20;
        balance += winAmount;
        balanceDisplay.textContent = balance + ' $';
        showWin(`برنده شدی! +${winAmount}$`);
    } else if (num === 0) {
        balance += 50;
        balanceDisplay.textContent = balance + ' $';
        showWin(`صفر سبز! +50$`);
    }
}

function showWin(text) {
    winAlert.textContent = text;
    winAlert.classList.add('show');
    setTimeout(() => winAlert.classList.remove('show'), 2500);
}

</script>
</body>
</html>
