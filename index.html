<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رولت اروپایی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --panel: #1c1c1c;
    --btn: #25272b;
    --btn-gray: #3d3d3d;
    --lime: #c4f24b;
    --red: #e53935;
    --black: #111111;
    --green-btn: #8fc41e;
    --text: #ffffff;
    --muted: #8a8f98;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button { font-family: inherit; cursor: pointer; border: none; color: var(--text); }

  /* Header */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
  }
  .back-btn, .menu-btn {
    background: #1e1e1e;
    border-radius: 22px;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    font-size: 17px;
    font-weight: 600;
  }
  .back-btn svg { width: 22px; height: 22px; }
  .menu-btn { width: 84px; justify-content: center; }
  .menu-btn span { width: 4px; height: 4px; background: #fff; border-radius: 50%; display: inline-block; }
  .menu-btn .chev { width: 18px; height: 18px; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 20px 16px;
    border-bottom: 1px solid #222;
  }
  .user-box { display: flex; flex-direction: column; gap: 8px; }
  .username { font-size: 14px; color: #d0d0d0; }
  .balance {
    background: #1d2312;
    border-radius: 16px;
    height: 44px;
    width: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 15px;
  }
  .title { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

  /* Wheel */
  .wheel-area {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 56px 0 54px;
    position: relative;
  }
  .wheel-wrap { position: relative; width: 290px; height: 290px; }
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 16px solid var(--lime);
    z-index: 3;
  }
  .wheel-ring {
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 4px solid var(--lime);
    box-shadow: 0 0 14px rgba(196, 242, 75, 0.7), inset 0 0 10px rgba(196, 242, 75, 0.4);
    overflow: hidden;
    position: relative;
  }
  #wheel {
    width: 100%; height: 100%;
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 1);
  }
  .hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 52px; height: 52px;
    border-radius: 50%;
    background: #111;
    border: 3px solid var(--lime);
    color: var(--lime);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
    z-index: 2;
  }

  /* Bet panel */
  .bet-section { padding: 0 18px; margin-top: auto; }
  .bet-label {
    text-align: right;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 10px;
    padding-right: 4px;
  }
  .bet-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin-bottom: 9px;
  }
  .bet-btn {
    height: 50px;
    border-radius: 10px;
    background: var(--btn);
    font-size: 14px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    border: 2px solid transparent;
    transition: border-color 0.15s;
  }
  .bet-btn.zero { background: var(--green-btn); }
  .bet-btn.black { background: var(--btn-gray); }
  .bet-btn.red { background: var(--red); }
  .bet-btn.selected { border-color: var(--lime); }

  /* Chips and controls */
  .controls {
    background: #151515;
    border-radius: 22px 22px 0 0;
    padding: 18px 16px 30px;
    margin-top: 16px;
    border-top: 1px solid #1f1f1f;
  }
  .chips {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .chip {
    height: 40px;
    border-radius: 12px;
    background: #22242a;
    color: #9aa0a8;
    font-size: 14px;
  }
  .amount-input {
    width: 100%;
    height: 56px;
    border-radius: 14px;
    background: #22242a;
    border: none;
    color: #fff;
    text-align: center;
    font-size: 18px;
    font-family: inherit;
    margin-bottom: 12px;
    outline: none;
  }
  .spin-btn {
    width: 100%;
    height: 60px;
    border-radius: 16px;
    background: var(--lime);
    color: #000;
    font-size: 20px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .spin-btn:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>

  <div class="topbar">
    <button class="back-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
      <span>Back</span>
    </button>
    <button class="menu-btn" type="button">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      <span style="margin-right:10px"></span>
      <span></span>
      <span style="margin-left:-2px"></span>
    </button>
  </div>

  <div class="header">
    <div class="user-box">
      <div class="username">zedxer 👤</div>
      <div class="balance">💎 <span>۰</span></div>
    </div>
    <div class="title">رولت اروپایی <span>🎰</span></div>
  </div>

  <div class="wheel-area">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="wheel-ring">
        <svg id="wheel" viewBox="0 0 300 300"></svg>
      </div>
      <div class="hub">?</div>
    </div>
  </div>

  <div class="bet-section">
    <div class="bet-label">نوع شرط را انتخاب کنید:</div>
    <div class="bet-grid" id="betGrid">
      <button class="bet-btn zero" data-bet="zero">🟢 صفر ×۱۴</button>
      <button class="bet-btn black" data-bet="black">⚫ مشکی ×۲</button>
      <button class="bet-btn red selected" data-bet="red">🔴 قرمز ×۲</button>
      <button class="bet-btn" data-bet="number">عدد ×۳۶</button>
      <button class="bet-btn" data-bet="odd">فرد ×۲</button>
      <button class="bet-btn" data-bet="even">زوج ×۲</button>
      <button class="bet-btn" data-bet="dozen1">دوجین ۱ ×۳</button>
      <button class="bet-btn" data-bet="19-36">۱۹-۳۶ ×۲</button>
      <button class="bet-btn" data-bet="1-18">۱-۱۸ ×۲</button>
    </div>
  </div>

  <div class="controls">
    <div class="chips">
      <button class="chip" data-amount="100">۱۰۰</button>
      <button class="chip" data-amount="500">۵۰۰</button>
      <button class="chip" data-amount="1000">۱ک</button>
      <button class="chip" data-amount="5000">۵ک</button>
      <button class="chip" data-amount="10000">۱۰ک</button>
    </div>
    <input class="amount-input" id="amount" type="text" inputmode="numeric" value="10">
    <button class="spin-btn" id="spinBtn">🎰 چرخش</button>
  </div>

<script>
  const NUMBERS = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
  const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const SEG = 360 / NUMBERS.length;
  const CX = 150, CY = 150, R = 150, RT = 118;

  function pt(r, deg) {
    const rad = (deg - 90) * Math.PI / 180;
    return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
  }

  const svgNS = "http://www.w3.org/2000/svg";
  const wheel = document.getElementById("wheel");

  NUMBERS.forEach((n, i) => {
    const start = i * SEG - SEG / 2;
    const end = i * SEG + SEG / 2;
    const [x1, y1] = pt(R, start);
    const [x2, y2] = pt(R, end);
    const path = document.createElementNS(svgNS, "path");
    const fill = n === 0 ? "#8fc41e" : (RED.has(n) ? "#e53935" : "#111111");
    path.setAttribute("d", `M${CX},${CY} L${x1},${y1} A${R},${R} 0 0,1 ${x2},${y2} Z`);
    path.setAttribute("fill", fill);
    path.setAttribute("stroke", "#222");
    path.setAttribute("stroke-width", "0.5");
    wheel.appendChild(path);

    const text = document.createElementNS(svgNS, "text");
    text.setAttribute("x", CX);
    text.setAttribute("y", CY - RT);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("dominant-baseline", "middle");
    text.setAttribute("fill", "#ffffff");
    text.setAttribute("font-size", "13");
    text.setAttribute("font-weight", "700");
    text.setAttribute("font-family", "Arial, sans-serif");
    text.setAttribute("transform", `rotate(${i * SEG} ${CX} ${CY})`);
    text.textContent = n;
    wheel.appendChild(text);
  });

  // Bet selection
  let selectedBet = "red";
  document.querySelectorAll(".bet-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".bet-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedBet = btn.dataset.bet;
    });
  });

  // Chips set the amount
  const amountInput = document.getElementById("amount");
  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      amountInput.value = chip.dataset.amount;
    });
  });

  // Spin
  const spinBtn = document.getElementById("spinBtn");
  let currentRotation = 0;
  let spinning = false;

  spinBtn.addEventListener("click", () => {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;

    const winIndex = Math.floor(Math.random() * NUMBERS.length);
    const extra = 360 * (5 + Math.floor(Math.random() * 3));
    const mod = (x) => ((x % 360) + 360) % 360;
    const target = -(winIndex * SEG);
    const delta = mod(target - mod(currentRotation));
    currentRotation += extra + delta;

    wheel.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      spinning = false;
      spinBtn.disabled = false;
    }, 4100);
  });
</script>
</body>
</html>
