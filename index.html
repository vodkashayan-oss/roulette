<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Roulette Game</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f1015; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
    
    .app { width: 100%; max-width: 500px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }

    /* =========================================
       نوار بالایی (تاریخچه - دقیقا مثل عکس)
       ========================================= */
    .top-bar { background: #1a1b23; border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 10px; direction: ltr; overflow: hidden; }
    .classic-btn { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: #fff; padding: 0 8px; white-space: nowrap; border-right: 1px solid #333; padding-right: 12px; }
    .history-container { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; align-items: center; }
    .history-container::-webkit-scrollbar { display: none; }
    
    /* باکس‌های اعداد تاریخچه */
    .hist-box { min-width: 40px; height: 45px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px; color: #fff; position: relative; }
    .hist-box.red { background: #d32f2f; }
    .hist-box.black { background: #2a2b33; }
    .hist-box.green { background: #388e3c; }
    
    /* خط زرد وسط عدد صفر */
    .hist-box.green::after { content: ''; position: absolute; width: 2px; height: 100%; background: #fbc02d; }

    /* =========================================
       چرخ رولت (کوچک شده که صفحه رو به هم نزنه)
       ========================================= */
    .wheel-container { display: flex; justify-content: center; align-items: center; height: 140px; margin: 5px 0; }
    canvas { width: 130px; height: 130px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.6)); }

    /* =========================================
       میز شرط بندی
       ========================================= */
    .table-wrapper { background: #1a1b23; padding: 8px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px; direction: ltr; }
    .main-grid { display: grid; grid-template-columns: 38px 1fr 38px; gap: 4px; }
    
    .zero-box { background: #388e3c; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; cursor: pointer; user-select: none; }
    
    .numbers-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
    .num-cell { height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; cursor: pointer; user-select: none; transition: transform 0.1s; }
    .num-cell:active { transform: scale(0.9); }
    .num-cell.red { background: #d32f2f; color: #fff; }
    .num-cell.black { background: #2a2b33; color: #fff; }
    
    .twotoone-col { display: flex; flex-direction: column; gap: 4px; }
    .twotoone-box { background: #2a2b33; color: #888; flex: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; cursor: pointer; }

    .bottom-grid { display: grid; gap: 4px; margin-top: 2px; }
    .row-3-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-left: 42px; margin-right: 42px; }
    .row-6-col { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-left: 42px; margin-right: 42px; }
    
    .bot-cell { height: 32px; border-radius: 6px; background: #2a2b33; color: #ddd; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; cursor: pointer; }
    .bot-cell.red { background: #d32f2f; color: #fff; }
    .bot-cell.black { background: #1a1b23; border: 1px solid #333; color: #fff; }

    /* =========================================
       بخش کنترل‌ها
       ========================================= */
    .controls-wrapper { background: #1a1b23; padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; direction: ltr; }
    .tabs { display: flex; border-bottom: 1px solid #333; margin-bottom: 4px; }
    .tab { flex: 1; text-align: center; padding: 8px 0; color: #888; font-size: 13px; font-weight: bold; cursor: pointer; }
    .tab.active { color: #fff; border-bottom: 2px solid #4caf50; }

    .spin-btn { width: 100%; padding: 14px; border-radius: 8px; border: none; background: #388e3c; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .spin-btn:active { background: #2e7d32; }
    .spin-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    .info-box { background: #0f1015; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }
    .info-label { color: #888; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    .info-content { display: flex; justify-content: space-between; align-items: center; }
    .info-value { font-size: 16px; font-weight: bold; color: #fff; }
    
    .crypto-select { display: flex; align-items: center; gap: 6px; background: #2a2b33; padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
    
    .chip-box { background: #0f1015; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: flex-end; }
    .chip-left { display: flex; flex-direction: column; gap: 4px; }
    .chip-actions { display: flex; gap: 4px; }
    .chip-btn { background: #2a2b33; border: none; color: #aaa; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .arrow-actions { display: flex; flex-direction: column; gap: 2px; }
    .arrow-btn { background: #2a2b33; border: none; color: #aaa; width: 30px; height: 15px; border-radius: 4px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .win-alert { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #4caf50; color: white; padding: 12px 24px; border-radius: 20px; font-weight: bold; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .win-alert.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="win-alert" id="winAlert">شما برنده شدید!</div>

<div class="app">
    
    <!-- ۱. نوار بالایی (تاریخچه) -->
    <div class="top-bar">
        <div class="classic-btn">✨ Classic ▼</div>
        <div class="history-container" id="historyBar">
            <!-- اعداد اولیه دقیقا مثل عکس -->
            <div class="hist-box red">19</div>
            <div class="hist-box black">15</div>
            <div class="hist-box red">32</div>
            <div class="hist-box green">0</div>
            <div class="hist-box black">26</div>
            <div class="hist-box red">3</div>
            <div class="hist-box black">35</div>
        </div>
    </div>

    <!-- ۲. چرخ بازی -->
    <div class="wheel-container">
        <canvas id="wheelCanvas" width="130" height="130"></canvas>
    </div>

    <!-- ۳. میز شرط بندی -->
    <div class="table-wrapper">
        <div class="main-grid">
            <div class="zero-box" onclick="alert('شرط روی صفر')">0</div>
            <div class="numbers-grid" id="numbersGrid"></div>
            <div class="twotoone-col">
                <div class="twotoone-box" onclick="alert('شرط روی ستون ۱')">2:1</div>
                <div class="twotoone-box" onclick="alert('شرط روی ستون ۲')">2:1</div>
                <div class="twotoone-box" onclick="alert('شرط روی ستون ۳')">2:1</div>
            </div>
        </div>

        <div class="row-3-col" style="margin-top: 4px;">
            <div class="bot-cell" onclick="alert('شرط 1ST 12')">1ST 12</div>
            <div class="bot-cell" onclick="alert('شرط 2ND 12')">2ND 12</div>
            <div class="bot-cell" onclick="alert('شرط 3RD 12')">3RD 12</div>
        </div>
        <div class="row-6-col">
            <div class="bot-cell" onclick="alert('شرط 1-18')">1-18</div>
            <div class="bot-cell" onclick="alert('شرط EVEN')">EVEN</div>
            <div class="bot-cell red" onclick="alert('شرط RED')">RED</div>
            <div class="bot-cell black" onclick="alert('شرط BLACK')">BLACK</div>
            <div class="bot-cell" onclick="alert('شرط ODD')">ODD</div>
            <div class="bot-cell" onclick="alert('شرط 19-36')">19-36</div>
        </div>
    </div>

    <!-- ۴. کنترل‌ها -->
    <div class="controls-wrapper">
        <div class="tabs">
            <div class="tab active">Manual</div>
            <div class="tab">Auto</div>
            <div class="tab">Advanced</div>
        </div>
        
        <button class="spin-btn" id="spinBtn">Spin</button>
        
        <div class="info-box">
            <div class="info-label">Balance</div>
            <div class="info-content">
                <div class="info-value" id="balanceDisplay">1000</div>
                <div class="crypto-select">₿ BTC ▼</div>
            </div>
        </div>
        
        <div class="chip-box">
            <div class="chip-left">
                <div class="info-label">Chip Size</div>
                <div class="info-value">₿ 0.00000001</div>
            </div>
            <div class="chip-actions">
                <button class="chip-btn">½</button>
                <button class="chip-btn">2x</button>
                <div class="arrow-actions">
                    <button class="arrow-btn">▲</button>
                    <button class="arrow-btn">▼</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
const NUMBERS = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
let balance = 1000;

// ساخت جدول اعداد
const numbersGrid = document.getElementById('numbersGrid');
numbersGrid.innerHTML = '';
for (let i = 1; i <= 12; i++) { let n = i * 3; numbersGrid.innerHTML += `<div class="num-cell ${RED.has(n) ? 'red' : 'black'}">${n}</div>`; }
for (let i = 1; i <= 12; i++) { let n = i * 3 - 1; numbersGrid.innerHTML += `<div class="num-cell ${RED.has(n) ? 'red' : 'black'}">${n}</div>`; }
for (let i = 1; i <= 12; i++) { let n = i * 3 - 2; numbersGrid.innerHTML += `<div class="num-cell ${RED.has(n) ? 'red' : 'black'}">${n}</div>`; }

// انیمیشن چرخ
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const CX = 65, CY = 65, R = 55;
const POCKETS = 37;
const STEP = (Math.PI * 2) / POCKETS;

function drawWheel(angle) {
    ctx.clearRect(0, 0, 130, 130);
    for (let i = 0; i < POCKETS; i++) {
        const start = i * STEP + angle;
        const end = (i + 1) * STEP + angle;
        ctx.beginPath(); ctx.moveTo(CX, CY); ctx.arc(CX, CY, R, start, end); ctx.closePath();
        const num = NUMBERS[i];
        ctx.fillStyle = num === 0 ? '#388e3c' : (RED.has(num) ? '#d32f2f' : '#2a2b33');
        ctx.fill();
        ctx.strokeStyle = '#0f1015'; ctx.lineWidth = 1; ctx.stroke();
        
        ctx.save(); ctx.translate(CX, CY); ctx.rotate(start + STEP / 2); ctx.translate(R - 8, 0); ctx.rotate(Math.PI / 2);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 7px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(num, 0, 0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(CX, CY, 15, 0, Math.PI * 2); ctx.fillStyle = '#1a1b23'; ctx.fill(); ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CX, CY - R - 1); ctx.lineTo(CX - 4, CY - R - 8); ctx.lineTo(CX + 4, CY - R - 8); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();
}

let currentAngle = 0;
drawWheel(currentAngle);

const spinBtn = document.getElementById('spinBtn');
const historyBar = document.getElementById('historyBar');
const balanceDisplay = document.getElementById('balanceDisplay');
const winAlert = document.getElementById('winAlert');
let isSpinning = false;

spinBtn.addEventListener('click', () => {
    if (isSpinning) return;
    if (balance < 10) { alert('موجودی کافی نیست!'); return; }
    
    isSpinning = true;
    spinBtn.disabled = true;
    balance -= 10; 
    balanceDisplay.textContent = balance;
    
    const targetIndex = Math.floor(Math.random() * POCKETS);
    const targetNum = NUMBERS[targetIndex];
    
    const targetSliceCenter = targetIndex * STEP + (STEP / 2);
    let exactTargetAngle = -Math.PI / 2 - targetSliceCenter;
    exactTargetAngle = (exactTargetAngle % (Math.PI * 2) + (Math.PI * 2)) % (Math.PI * 2);
    let targetAngle = exactTargetAngle + (Math.PI * 2 * 10);
    
    while (targetAngle <= currentAngle) { targetAngle += Math.PI * 2; }

    const duration = 4000; 
    const startTime = performance.now();
    const startAngle = currentAngle;

    function animate(time) {
        const progress = Math.min((time - startTime) / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
        drawWheel(currentAngle);
        
        if (progress < 1) { requestAnimationFrame(animate); } else { finishGame(targetNum); }
    }
    requestAnimationFrame(animate);
});

function finishGame(num) {
    isSpinning = false;
    spinBtn.disabled = false;
    
    // اضافه کردن به تاریخچه با انیمیشن
    const type = num === 0 ? 'green' : (RED.has(num) ? 'red' : 'black');
    const histBox = document.createElement('div');
    histBox.className = `hist-box ${type}`;
    histBox.textContent = num;
    
    // درج در ابتدای لیست (سمت چپ در حالت LTR)
    historyBar.prepend(histBox);
    if (historyBar.children.length > 7) historyBar.lastChild.remove();
    
    if (num !== 0 && Math.random() > 0.5) {
        balance += 20;
        balanceDisplay.textContent = balance;
        showWin(`برنده شدی! +20$`);
    } else if (num === 0) {
        balance += 50;
        balanceDisplay.textContent = balance;
        showWin(`صفر سبز! +50$`);
    }
}

function showWin(text) {
    winAlert.textContent = text;
    winAlert.classList.add('show');
    setTimeout(() => winAlert.classList.remove('show'), 2500);
}
</script>
</body>
</html>
