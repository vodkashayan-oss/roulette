<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رولت اروپایی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c;
    --btn: #25272b;
    --lime: #c4f24b;
    --red: #e53935;
    --green-btn: #1f9d3a;
    --muted: #8a8f98;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    text-rendering: geometricPrecision;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; color: #fff; }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px 4px;
    flex-shrink: 0;
  }
  .pill {
    background: #1e1e1e;
    border-radius: 20px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
  }
  .back-btn { padding: 0 14px; }
  .menu-btn { width: 70px; }
  .menu-btn .dot { width: 4px; height: 4px; background: #fff; border-radius: 50%; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 16px 8px;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }
  .user-box { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .username { font-size: 12px; color: #d0d0d0; }
  .balance-chip {
    background: #1d2312;
    border-radius: 14px;
    height: 32px;
    min-width: 72px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 13px;
  }
  .title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

  /* Strip (horizontal roulette) */
  .strip-area {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 6px 0 4px;
  }
  .strip-wrap {
    position: relative;
    width: 100%;
    height: 64px;
    overflow: hidden;
    background: #0c0c0c;
    border-top: 1px solid #1f1f1f;
    border-bottom: 1px solid #1f1f1f;
  }
  .strip-pointer {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    margin-left: -1px;
    background: #f5c518;
    z-index: 2;
  }
  .strip-track {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    display: flex;
    direction: ltr;
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 1);
    will-change: transform;
  }
  .strip-cell {
    flex: 0 0 54px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .strip-cell span {
    width: 48px;
    height: 44px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    font-family: Arial, sans-serif;
  }
  .strip-cell.red span { background: var(--red); }
  .strip-cell.black span { background: #2a2d33; }
  .strip-cell.green span { background: #1f9d3a; }

  .result {
    min-height: 20px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    padding: 0 10px;
  }
  .result.win { color: var(--lime); }
  .result.lose { color: #ff6b6b; }

  /* Betting table */
  .table-wrap {
    flex-shrink: 0;
    padding: 0 8px;
  }
  .table-grid {
    display: grid;
    grid-template-columns: 46px repeat(12, 1fr) 40px;
    grid-template-rows: repeat(3, 26px);
    gap: 3px;
    direction: ltr;
  }
  .t-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    font-family: Arial, sans-serif;
    color: #fff;
    border-radius: 3px;
    background: #2a2d33;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .t-cell.red { background: var(--red); }
  .t-cell.black { background: #2a2d33; }
  .t-cell.sel { border-color: var(--lime); }
  .t-zero {
    grid-column: 1;
    grid-row: 1 / 4;
    background: var(--green-btn);
    border-radius: 4px;
    font-size: 14px;
  }
  .t-col {
    background: #2a2d33;
    font-size: 11px;
    color: #cfd3d8;
    cursor: default;
  }
  .t-dozen-row {
    grid-column: 2 / 14;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin-top: 3px;
  }
  .t-dozen {
    height: 22px;
    border-radius: 4px;
    background: #22242a;
    color: #cfd3d8;
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .t-outside-row {
    grid-column: 2 / 14;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3px;
    margin-top: 3px;
  }
  .t-outside {
    height: 22px;
    border-radius: 4px;
    background: #22242a;
    color: #cfd3d8;
    font-size: 10px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .t-outside.red { background: var(--red); color: #fff; }
  .t-outside.black { background: #111; color: #fff; }
  .t-dozen.sel, .t-outside.sel { border-color: var(--lime); }

  /* Control panel (below table) */
  .panel {
    padding: 12px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
    background: #111;
    border-top: 1px solid #1f1f1f;
    flex-shrink: 0;
  }
  .spin-btn {
    width: 100%;
    height: 48px;
    border-radius: 14px;
    background: var(--lime);
    color: #000;
    font-size: 17px;
    font-weight: 700;
  }
  .spin-btn:disabled { opacity: 0.6; }
  .field-label {
    font-size: 12px;
    color: var(--muted);
    padding-right: 4px;
  }
  .field {
    height: 46px;
    border-radius: 12px;
    background: #1b1d22;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    gap: 8px;
  }
  .field-value {
    font-size: 16px;
    font-weight: 600;
    direction: ltr;
  }
  .field-unit {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .amount-input {
    flex: 1;
    min-width: 0;
    height: 100%;
    background: transparent;
    border: none;
    color: #fff;
    text-align: center;
    font-size: 16px;
    font-family: inherit;
    outline: none;
  }
  .mini-group {
    display: flex;
    gap: 6px;
  }
  .mini {
    min-width: 36px;
    height: 30px;
    border-radius: 8px;
    background: #22242a;
    font-size: 14px;
    font-weight: 600;
    padding: 0 8px;
  }
  .arrows {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .arrows button {
    width: 26px;
    height: 20px;
    border-radius: 6px;
    background: #22242a;
    font-size: 10px;
    line-height: 1;
  }
</style>
</head>
<body>

  <div class="topbar">
    <button class="pill back-btn" type="button">
      <span>Back</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
    </button>
    <button class="pill menu-btn" type="button">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </button>
  </div>

  <div class="header">
    <div class="title">رولت اروپایی <span>🎰</span></div>
    <div class="user-box">
      <div class="username">👤 zedxer</div>
      <div class="balance-chip">💎 <span id="headerBalance">۰</span></div>
    </div>
  </div>

  <div class="strip-area">
    <div class="strip-wrap" id="stripWrap">
      <div class="strip-pointer"></div>
      <div class="strip-track" id="track"></div>
    </div>
    <div class="result" id="result"></div>
  </div>

  <div class="table-wrap">
    <div class="table-grid" id="tableGrid"></div>
    <div class="t-dozen-row">
      <div class="t-dozen" data-bet="dozen1">1ST 12</div>
      <div class="t-dozen" data-bet="dozen2">2ND 12</div>
      <div class="t-dozen" data-bet="dozen3">3RD 12</div>
    </div>
    <div class="t-outside-row">
      <div class="t-outside" data-bet="1-18">1-18</div>
      <div class="t-outside" data-bet="even">EVEN</div>
      <div class="t-outside red" data-bet="red">RED</div>
      <div class="t-outside black" data-bet="black">BLACK</div>
      <div class="t-outside" data-bet="odd">ODD</div>
      <div class="t-outside" data-bet="19-36">19-36</div>
    </div>
  </div>

  <div class="panel">
    <button class="spin-btn" id="spinBtn">چرخش</button>

    <div class="field-label">موجودی</div>
    <div class="field">
      <span class="field-value" id="balanceText">۰</span>
      <span class="field-unit">💎 الماس</span>
    </div>

    <div class="field-label">مقدار شرط</div>
    <div class="field">
      <div class="mini-group">
        <button class="mini" id="halfBtn" type="button">½</button>
        <button class="mini" id="doubleBtn" type="button">2×</button>
      </div>
      <input class="amount-input" id="amount" type="text" inputmode="numeric" value="1">
      <div class="arrows">
        <button id="upBtn" type="button">▲</button>
        <button id="downBtn" type="button">▼</button>
      </div>
    </div>
  </div>

<script>
  const NUMBERS = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
  const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const COUNT = NUMBERS.length;
  const CELL_W = 54;
  const COPIES = 16;
  const START_BALANCE = 1000;
  const MIN_BET = 1;

  const stripWrap = document.getElementById("stripWrap");
  const track = document.getElementById("track");
  const resultEl = document.getElementById("result");
  const amountInput = document.getElementById("amount");
  const balanceText = document.getElementById("balanceText");
  const headerBalance = document.getElementById("headerBalance");
  const tableGrid = document.getElementById("tableGrid");
  const spinBtn = document.getElementById("spinBtn");

  let balance = START_BALANCE;
  let selectedBet = "red";
  let chosenNumber = null;
  let spinning = false;
  let idx = COUNT * 2;

  const fmt = (n) => Number(n).toLocaleString("fa-IR");
  const toEnDigits = (s) => s.replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[^\d]/g, "");

  function updateBalance() {
    balanceText.textContent = fmt(balance);
    headerBalance.textContent = fmt(balance);
  }

  function getAmount() {
    let v = parseInt(toEnDigits(amountInput.value), 10);
    if (isNaN(v) || v < MIN_BET) v = MIN_BET;
    return v;
  }
  function setAmount(v) {
    amountInput.value = String(Math.max(MIN_BET, Math.floor(v)));
  }

  // Betting table
  function selectBet(bet, num) {
    document.querySelectorAll("[data-bet]").forEach(el => el.classList.remove("sel"));
    if (bet === "number") {
      chosenNumber = num;
      document.querySelectorAll(`.t-cell[data-num="${num}"]`).forEach(el => el.classList.add("sel"));
    } else {
      chosenNumber = null;
      document.querySelectorAll(`[data-bet="${bet}"]`).forEach(el => el.classList.add("sel"));
    }
    selectedBet = bet;
  }

  const zeroCell = document.createElement("div");
  zeroCell.className = "t-cell t-zero";
  zeroCell.textContent = "0";
  zeroCell.dataset.num = "0";
  zeroCell.addEventListener("click", () => selectBet("number", 0));
  tableGrid.appendChild(zeroCell);

  for (let c = 0; c < 12; c++) {
    [3 * c + 3, 3 * c + 2, 3 * c + 1].forEach((n, r) => {
      const cell = document.createElement("div");
      cell.className = "t-cell " + (RED.has(n) ? "red" : "black");
      cell.style.gridColumn = c + 2;
      cell.style.gridRow = r + 1;
      cell.textContent = n;
      cell.dataset.num = n;
      cell.addEventListener("click", () => selectBet("number", n));
      tableGrid.appendChild(cell);
    });
  }

  for (let r = 1; r <= 3; r++) {
    const cell = document.createElement("div");
    cell.className = "t-cell t-col";
    cell.style.gridColumn = 14;
    cell.style.gridRow = r;
    cell.textContent = "2:1";
    tableGrid.appendChild(cell);
  }

  document.querySelectorAll(".t-dozen, .t-outside").forEach(el => {
    el.addEventListener("click", () => selectBet(el.dataset.bet));
  });

  // Strip
  for (let c = 0; c < COPIES; c++) {
    NUMBERS.forEach(n => {
      const cell = document.createElement("div");
      const color = n === 0 ? "green" : (RED.has(n) ? "red" : "black");
      cell.className = "strip-cell " + color;
      const inner = document.createElement("span");
      inner.textContent = n;
      cell.appendChild(inner);
      track.appendChild(cell);
    });
  }

  function placeTrack(k, animate) {
    const center = stripWrap.clientWidth / 2;
    const x = center - (k * CELL_W + CELL_W / 2);
    track.style.transition = animate ? "" : "none";
    track.style.transform = `translateX(${x}px)`;
    if (!animate) void track.offsetWidth;
  }

  placeTrack(idx, false);
  window.addEventListener("resize", () => {
    if (!spinning) placeTrack(idx, false);
  });

  // Chip size controls
  document.getElementById("halfBtn").addEventListener("click", () => setAmount(getAmount() / 2));
  document.getElementById("doubleBtn").addEventListener("click", () => setAmount(getAmount() * 2));
  document.getElementById("upBtn").addEventListener("click", () => setAmount(getAmount() + 1));
  document.getElementById("downBtn").addEventListener("click", () => setAmount(getAmount() - 1));
  amountInput.addEventListener("blur", () => setAmount(getAmount()));

  function isWin(bet, n) {
    switch (bet) {
      case "zero": return n === 0;
      case "number": return n === chosenNumber;
      case "red": return RED.has(n);
      case "black": return n !== 0 && !RED.has(n);
      case "odd": return n !== 0 && n % 2 === 1;
      case "even": return n !== 0 && n % 2 === 0;
      case "dozen1": return n >= 1 && n <= 12;
      case "dozen2": return n >= 13 && n <= 24;
      case "dozen3": return n >= 25 && n <= 36;
      case "19-36": return n >= 19 && n <= 36;
      case "1-18": return n >= 1 && n <= 18;
      default: return false;
    }
  }

  function multiplier(bet) {
    if (bet === "number") return 36;
    if (bet === "dozen1" || bet === "dozen2" || bet === "dozen3") return 3;
    return 2;
  }

  function betLabel(bet) {
    if (bet === "number") return `عدد ${fmt(chosenNumber)}`;
    return {
      red: "قرمز", black: "مشکی", odd: "فرد", even: "زوج",
      dozen1: "دوجین ۱", dozen2: "دوجین ۲", dozen3: "دوجین ۳",
      "19-36": "۱۹-۳۶", "1-18": "۱-۱۸"
    }[bet];
  }

  function showResult(text, cls) {
    resultEl.textContent = text;
    resultEl.className = "result " + (cls || "");
  }

  // Spin
  spinBtn.addEventListener("click", () => {
    if (spinning) return;

    if (selectedBet === "number" && chosenNumber === null) {
      showResult("ابتدا یک عدد انتخاب کنید", "lose");
      return;
    }

    const amount = getAmount();
    if (amount > balance) {
      showResult("موجودی کافی نیست", "lose");
      return;
    }

    balance -= amount;
    updateBalance();

    spinning = true;
    spinBtn.disabled = true;
    showResult("در حال چرخش...");

    const winIndex = Math.floor(Math.random() * COUNT);
    const winNumber = NUMBERS[winIndex];
    const laps = 5 + Math.floor(Math.random() * 3);
    const delta = ((winIndex - (idx % COUNT)) % COUNT + COUNT) % COUNT;
    const target = idx + laps * COUNT + delta;

    placeTrack(target, true);
    idx = target;

    setTimeout(() => {
      idx = COUNT * 2 + (idx % COUNT);
      placeTrack(idx, false);

      const label = betLabel(selectedBet);
      if (isWin(selectedBet, winNumber)) {
        const payout = amount * multiplier(selectedBet);
        balance += payout;
        updateBalance();
        showResult(`عدد ${fmt(winNumber)} — بردید! (${label}) الماس برد: ${fmt(payout)}`, "win");
      } else {
        showResult(`عدد ${fmt(winNumber)} — باختید (${label}) الماس باخت: ${fmt(amount)}`, "lose");
      }
      spinning = false;
      spinBtn.disabled = false;
    }, 4100);
  });

  // Default selection
  selectBet("red");
  updateBalance();
</script>
</body>
</html>
