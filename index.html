<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رولت اروپایی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0c0c0c;
    --btn: #25272b;
    --lime: #c4f24b;
    --red: #e53935;
    --green-btn: #1f9d3a;
    --muted: #8a8f98;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    text-rendering: geometricPrecision;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; color: #fff; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 12px 16px 8px;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }
  .username { font-size: 13px; color: #d0d0d0; }

  /* Strip */
  .strip-area {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 0 4px;
  }
  .strip-wrap {
    position: relative;
    width: 100%;
    height: 64px;
    overflow: hidden;
    background: #0c0c0c;
    border-top: 1px solid #1f1f1f;
    border-bottom: 1px solid #1f1f1f;
  }
  .strip-pointer {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    margin-left: -1px;
    background: #f5c518;
    z-index: 2;
  }
  .strip-track {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    display: flex;
    direction: ltr;
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 1);
    will-change: transform;
  }
  .strip-cell {
    flex: 0 0 54px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .strip-cell span {
    width: 48px;
    height: 44px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    font-family: Arial, sans-serif;
  }
  .strip-cell.red span { background: var(--red); }
  .strip-cell.black span { background: #2a2d33; }
  .strip-cell.green span { background: var(--green-btn); }

  .result {
    min-height: 20px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    padding: 0 10px;
  }
  .result.win { color: var(--lime); }
  .result.lose { color: #ff6b6b; }

  /* Betting table */
  .table-wrap {
    flex-shrink: 0;
    padding: 0 8px;
  }
  .table-grid {
    display: grid;
    grid-template-columns: 46px repeat(12, 1fr) 40px;
    grid-template-rows: repeat(3, 26px);
    gap: 3px;
    direction: ltr;
  }
  .t-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    font-family: Arial, sans-serif;
    color: #fff;
    border-radius: 3px;
    background: #2a2d33;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .t-cell.red { background: var(--red); }
  .t-cell.black { background: #2a2d33; }
  .t-zero {
    grid-column: 1;
    grid-row: 1 / 4;
    background: var(--green-btn);
    border-radius: 4px;
    font-size: 14px;
  }
  .t-col {
    background: #2a2d33;
    font-size: 11px;
    color: #cfd3d8;
    cursor: default;
  }
  .t-dozen-row {
    grid-column: 2 / 14;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin-top: 4px;
  }
  .t-dozen, .t-outside {
    height: 30px;
    border-radius: 4px;
    background: #22242a;
    color: #cfd3d8;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    cursor: pointer;
    border: 2px solid transparent;
    line-height: 1.1;
  }
  .t-dozen { font-size: 11px; }
  .t-outside-row {
    grid-column: 2 / 14;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3px;
    margin-top: 4px;
  }
  .t-outside { font-size: 10px; }
  .t-outside.red { background: var(--red); color: #fff; }
  .t-outside.black { background: #111; color: #fff; }
  .t-dozen small, .t-outside small {
    font-size: 9px;
    font-weight: 600;
    color: #a9aeb6;
  }
  .sel { border-color: var(--lime) !important; }

  /* Scene: 3D roulette wheel in the centre */
  .scene {
    flex-shrink: 0;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    perspective: 600px;
  }
  .wheel3d {
    position: relative;
    width: 150px;
    height: 150px;
    transform: rotateX(55deg);
    transform-style: preserve-3d;
  }
  .wheel3d-base {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, #4a2f16 60%, #2a1808 100%);
    transform: translateZ(-10px);
    box-shadow: 0 14px 20px rgba(0, 0, 0, 0.6);
  }
  .wheel3d svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    animation: spin 14s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Control panel (pushed to the bottom of the screen) */
  .panel {
    margin-top: auto;
    padding: 20px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #111;
    flex-shrink: 0;
  }
  .spin-btn {
    width: 100%;
    height: 48px;
    border-radius: 14px;
    background: var(--lime);
    color: #000;
    font-size: 17px;
    font-weight: 700;
  }
  .spin-btn:disabled { opacity: 0.6; }
  .field-label {
    font-size: 12px;
    color: var(--muted);
    padding-right: 4px;
  }
  .field-label.center { text-align: center; padding-right: 0; }
  .balance-box {
    height: 46px;
    border-radius: 12px;
    background: #1b1d22;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 16px;
    font-weight: 600;
  }
  .field {
    height: 46px;
    border-radius: 12px;
    background: #1b1d22;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    gap: 8px;
  }
  .amount-input {
    flex: 1;
    min-width: 0;
    height: 100%;
    background: transparent;
    border: none;
    color: #fff;
    text-align: center;
    font-size: 16px;
    font-family: inherit;
    outline: none;
  }
  .mini-group { display: flex; gap: 6px; }
  .mini {
    min-width: 36px;
    height: 30px;
    border-radius: 8px;
    background: #22242a;
    font-size: 14px;
    font-weight: 600;
    padding: 0 8px;
  }
  .arrows { display: flex; flex-direction: column; gap: 2px; }
  .arrows button {
    width: 26px;
    height: 20px;
    border-radius: 6px;
    background: #22242a;
    font-size: 10px;
    line-height: 1;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="username" id="userName">👤</div>
  </div>

  <div class="strip-area">
    <div class="strip-wrap" id="stripWrap">
      <div class="strip-pointer"></div>
      <div class="strip-track" id="track"></div>
    </div>
    <div class="result" id="result"></div>
  </div>

  <div class="table-wrap">
    <div class="table-grid" id="tableGrid"></div>
    <div class="t-dozen-row">
      <div class="t-dozen" data-key="d3">36_25<small>3×</small></div>
      <div class="t-dozen" data-key="d2">13_24<small>3×</small></div>
      <div class="t-dozen" data-key="d1">1_12<small>3×</small></div>
    </div>
    <div class="t-outside-row">
      <div class="t-outside" data-key="o:high">19-36<small>2×</small></div>
      <div class="t-outside" data-key="o:zoj">زوج 2×</div>
      <div class="t-outside red" data-key="o:red">قرمز 2×</div>
      <div class="t-outside black" data-key="o:black">سیاه 2×</div>
      <div class="t-outside" data-key="o:fard">فرد 2×</div>
      <div class="t-outside" data-key="o:low">1-18<small>2×</small></div>
    </div>
  </div>

  <div class="scene">
    <div class="wheel3d">
      <div class="wheel3d-base"></div>
      <div id="wheel3d" style="position:absolute;inset:0;"></div>
    </div>
  </div>

  <div class="panel">
    <button class="spin-btn" id="spinBtn">چرخش</button>

    <div class="field-label center">موجودی</div>
    <div class="balance-box">
      <span id="balanceText">۰</span>
      <span>💎 الماس</span>
    </div>

    <div class="field-label">مقدار شرط</div>
    <div class="field">
      <div class="mini-group">
        <button class="mini" id="halfBtn" type="button">½</button>
        <button class="mini" id="doubleBtn" type="button">2×</button>
      </div>
      <input class="amount-input" id="amount" type="text" inputmode="numeric" value="1">
      <div class="arrows">
        <button id="upBtn" type="button">▲</button>
        <button id="downBtn" type="button">▼</button>
      </div>
    </div>
  </div>

<script>
  const NUMBERS = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
  const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const COUNT = NUMBERS.length;
  const CELL_W = 54;
  const COPIES = 16;
  const START_BALANCE = 100000;
  const MIN_BET = 1;

  const $ = (id) => document.getElementById(id);
  const stripWrap = $("stripWrap");
  const track = $("track");
  const resultEl = $("result");
  const amountInput = $("amount");
  const balanceText = $("balanceText");
  const tableGrid = $("tableGrid");
  const spinBtn = $("spinBtn");
  const userNameEl = $("userName");

  // Show the Telegram user's name at the top
  (function setUserName() {
    let name = "مهمان";
    try {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (u) {
          name = u.username || [u.first_name, u.last_name].filter(Boolean).join(" ") || name;
        }
      }
    } catch (e) {}
    userNameEl.textContent = "👤 " + name;
  })();

  let balance = START_BALANCE;
  let selKey = "o:red";
  let spinning = false;
  let idx = COUNT * 2;

  const fmt = (n) => Number(n).toLocaleString("fa-IR");
  const toEn = (s) => s.replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[^\d]/g, "");

  function updateBalance() {
    balanceText.textContent = fmt(balance);
  }

  function getAmount() {
    let v = parseInt(toEn(amountInput.value), 10);
    if (isNaN(v) || v < MIN_BET) v = MIN_BET;
    return v;
  }
  function setAmount(v) {
    amountInput.value = String(Math.max(MIN_BET, Math.floor(v)));
  }

  // Bet definitions
  function betInfo(key) {
    if (key.startsWith("n:")) {
      const n = parseInt(key.slice(2), 10);
      return { label: `عدد ${n}`, mult: n === 0 ? 14 : 36, win: x => x === n };
    }
    switch (key) {
      case "d1": return { label: "1_12", mult: 3, win: x => x >= 1 && x <= 12 };
      case "d2": return { label: "13_24", mult: 3, win: x => x >= 13 && x <= 24 };
      case "d3": return { label: "36_25", mult: 3, win: x => x >= 25 && x <= 36 };
      case "o:low": return { label: "1-18", mult: 2, win: x => x >= 1 && x <= 18 };
      case "o:high": return { label: "19-36", mult: 2, win: x => x >= 19 && x <= 36 };
      case "o:red": return { label: "قرمز", mult: 2, win: x => RED.has(x) };
      case "o:black": return { label: "سیاه", mult: 2, win: x => x !== 0 && !RED.has(x) };
      case "o:fard": return { label: "فرد", mult: 2, win: x => x !== 0 && x % 2 === 1 };
      case "o:zoj": return { label: "زوج", mult: 2, win: x => x !== 0 && x % 2 === 0 };
    }
    return { label: "", mult: 0, win: () => false };
  }

  // Only one selection across the whole table
  function selectBet(key) {
    if (spinning) return;
    selKey = key;
    document.querySelectorAll(".sel").forEach(el => el.classList.remove("sel"));
    const el = document.querySelector(`[data-key="${key}"]`);
    if (el) el.classList.add("sel");
  }

  // Zero cell
  const zeroCell = document.createElement("div");
  zeroCell.className = "t-cell t-zero";
  zeroCell.textContent = "0";
  zeroCell.dataset.key = "n:0";
  tableGrid.appendChild(zeroCell);

  // Number cells (3 rows x 12 columns)
  for (let c = 0; c < 12; c++) {
    [3 * c + 3, 3 * c + 2, 3 * c + 1].forEach((n, r) => {
      const cell = document.createElement("div");
      cell.className = "t-cell " + (RED.has(n) ? "red" : "black");
      cell.style.gridColumn = c + 2;
      cell.style.gridRow = r + 1;
      cell.textContent = n;
      cell.dataset.key = "n:" + n;
      tableGrid.appendChild(cell);
    });
  }

  // 2:1 column (display only)
  for (let r = 1; r <= 3; r++) {
    const cell = document.createElement("div");
    cell.className = "t-cell t-col";
    cell.style.gridColumn = 14;
    cell.style.gridRow = r;
    cell.textContent = "2:1";
    tableGrid.appendChild(cell);
  }

  document.querySelectorAll("[data-key]").forEach(el => {
    el.addEventListener("click", () => selectBet(el.dataset.key));
  });

  // Horizontal strip
  for (let c = 0; c < COPIES; c++) {
    NUMBERS.forEach(n => {
      const cell = document.createElement("div");
      const color = n === 0 ? "green" : (RED.has(n) ? "red" : "black");
      cell.className = "strip-cell " + color;
      const inner = document.createElement("span");
      inner.textContent = n;
      cell.appendChild(inner);
      track.appendChild(cell);
    });
  }

  function placeTrack(k, animate) {
    const center = stripWrap.clientWidth / 2;
    const x = center - (k * CELL_W + CELL_W / 2);
    track.style.transition = animate ? "" : "none";
    track.style.transform = `translateX(${x}px)`;
    if (!animate) void track.offsetWidth;
  }

  placeTrack(idx, false);
  window.addEventListener("resize", () => {
    if (!spinning) placeTrack(idx, false);
  });

  // 3D wheel with numbers
  function wheelSVG() {
    const cx = 60, cy = 60, r = 56;
    const seg = 360 / COUNT;
    let s = '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">';
    s += '<circle cx="60" cy="60" r="58" fill="#5a3b1e"/>';
    s += '<circle cx="60" cy="60" r="55" fill="#111" stroke="#c9a14a" stroke-width="2"/>';
    NUMBERS.forEach((n, i) => {
      const a1 = (i * seg - seg / 2 - 90) * Math.PI / 180;
      const a2 = (i * seg + seg / 2 - 90) * Math.PI / 180;
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
      const fill = n === 0 ? "#1f9d3a" : (RED.has(n) ? "#e53935" : "#1a1a1a");
      s += `<path d="M60 60 L${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2} Z" fill="${fill}" stroke="#c9a14a" stroke-width="0.4"/>`;
      const tr = (i * seg - 90) * Math.PI / 180;
      const tx = cx + 42 * Math.cos(tr), ty = cy + 42 * Math.sin(tr);
      const rot = i * seg;
      s += `<text x="${tx}" y="${ty}" fill="#fff" font-size="6" font-weight="700" font-family="Arial" text-anchor="middle" dominant-baseline="middle" transform="rotate(${rot} ${tx} ${ty})">${n}</text>`;
    });
    s += '<circle cx="60" cy="60" r="16" fill="#c9a14a"/>';
    s += '<circle cx="60" cy="60" r="10" fill="#7a5a1e"/>';
    s += '</svg>';
    return s;
  }
  $("wheel3d").innerHTML = wheelSVG();

  // Amount controls
  $("halfBtn").addEventListener("click", () => setAmount(getAmount() / 2));
  $("doubleBtn").addEventListener("click", () => setAmount(getAmount() * 2));
  $("upBtn").addEventListener("click", () => setAmount(getAmount() + 1));
  $("downBtn").addEventListener("click", () => setAmount(getAmount() - 1));
  amountInput.addEventListener("blur", () => setAmount(getAmount()));

  function showResult(text, cls) {
    resultEl.textContent = text;
    resultEl.className = "result " + (cls || "");
  }

  // Spin: every number on the wheel has an equal chance
  spinBtn.addEventListener("click", () => {
    if (spinning) return;

    const info = betInfo(selKey);
    const amount = getAmount();

    if (amount > balance) {
      showResult("موجودی کافی نیست", "lose");
      return;
    }

    balance -= amount;
    updateBalance();

    spinning = true;
    spinBtn.disabled = true;
    showResult("در حال چرخش...");

    const winIndex = Math.floor(Math.random() * COUNT);
    const winNumber = NUMBERS[winIndex];
    const laps = 5 + Math.floor(Math.random() * 3);
    const delta = ((winIndex - (idx % COUNT)) % COUNT + COUNT) % COUNT;
    const target = idx + laps * COUNT + delta;

    placeTrack(target, true);
    idx = target;

    setTimeout(() => {
      idx = COUNT * 2 + (idx % COUNT);
      placeTrack(idx, false);

      if (info.win(winNumber)) {
        const payout = amount * info.mult;
        balance += payout;
        updateBalance();
        showResult(`عدد ${fmt(winNumber)} — بردید! (${info.label}) الماس برد: ${fmt(payout)}`, "win");
      } else {
        showResult(`عدد ${fmt(winNumber)} — باختید (${info.label}) الماس باخت: ${fmt(amount)}`, "lose");
      }

      spinning = false;
      spinBtn.disabled = false;
    }, 4100);
  });

  // Default selection and initial balance
  selectBet("o:red");
  updateBalance();
</script>
</body>
</html>
